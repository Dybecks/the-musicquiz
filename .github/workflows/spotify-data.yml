name: Look up Spotify data

# Fills in Spotify track ids for the ready-made decks and builds the genre
# lists (scripts/spotify-precompute.ts). It needs two repository secrets:
# SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET (Settings → Secrets and
# variables → Actions). Results go to the branch "spotify-data" and a pull
# request from it. Each run makes at most a few hundred requests and stops
# early if Spotify asks for a long pause; the scheduled runs carry on until
# everything is looked up, then cost nothing.

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: Most Spotify requests this run may make
        default: '300'
  schedule:
    # Every 6 hours, until there is nothing left to look up.
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spotify-data
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Carry on from earlier runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin spotify-data >/dev/null; then
            git fetch origin spotify-data
            git checkout -B spotify-data origin/spotify-data
            # Keep the branch up to date with the main branch's songs and code.
            git merge --no-edit "origin/${{ github.event.repository.default_branch }}" || {
              git merge --abort
              echo "::error::The spotify-data branch can't be merged with the main branch. Merge or delete it first."
              exit 1
            }
          else
            git checkout -B spotify-data
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Look up songs on Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MAX_REQUESTS: ${{ inputs.max_requests || '300' }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_CLIENT_SECRET" ]; then
            echo "::warning::Add the SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET secrets to look songs up."
            exit 0
          fi
          npx vite-node scripts/spotify-precompute.ts
      - run: npm test
      - name: Save the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data/spotify scripts/spotify-progress.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Look up Spotify ids and genre lists"
          fi
          if [ "$(git rev-list --count "origin/${{ github.event.repository.default_branch }}..HEAD")" = "0" ]; then
            echo "Nothing to propose."
            exit 0
          fi
          git push origin spotify-data
          # A pull request, if none is open yet (needs "Allow GitHub Actions
          # to create pull requests" in Settings → Actions; skipped otherwise).
          if [ -z "$(gh pr list --head spotify-data --state open --json number --jq '.[].number')" ]; then
            gh pr create --head spotify-data --base "${{ github.event.repository.default_branch }}" \
              --title "Spotify ids and genre lists" \
              --body "Looked up by the \"Look up Spotify data\" workflow. See src/data/spotify/REVIEW.md for songs that need a look." \
              || echo "::notice::Could not open a pull request; the results are on the spotify-data branch."
          fi
          cat src/data/spotify/REVIEW.md >> "$GITHUB_STEP_SUMMARY"
